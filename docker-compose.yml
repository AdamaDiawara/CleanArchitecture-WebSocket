services:
  db:
    image: postgres:18-alpine
    container_name: ecoeats-db
    environment:
      POSTGRES_USER: madbpostgres
      POSTGRES_PASSWORD: motdepasse
      POSTGRES_DB: EcoEats
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U madbpostgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecoeats-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecoeats-backend
    environment:
      DATABASE_URL: postgresql://madbpostgres:motdepasse@db:5432/EcoEats
      NODE_ENV: development
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
      - /app/dist
    networks:
      - ecoeats-network
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecoeats-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - ecoeats-network
    command: npm run dev

volumes:
  postgres-data:

networks:
  ecoeats-network:
    driver: bridge
